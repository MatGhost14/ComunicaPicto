name: comunicapicto
description: "Aplicación de comunicación aumentativa y alternativa (CAA) para niños con TEA."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # ADR-005: desde Flutter 3.47 Material se distribuye como paquete independiente.
  # El proyecto lo adopta directamente en lugar de package:flutter/material.dart.
  material_ui: ^1.0.0

  # Persistencia local (offline-first): SQLite mediante Drift.
  drift: ^2.35.0
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0
  path_provider: ^2.1.5

  # Identificadores UUID v4 como llave primaria de todas las entidades.
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  drift_dev: ^2.35.0
  build_runner: ^2.16.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package.
  flutter_lints: ^6.0.0

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Catálogo base de pictogramas ARASAAC incorporado en la app (sin descarga en red).
  assets:
    - assets/pictogramas/base/
